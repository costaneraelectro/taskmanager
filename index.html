<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoy">
<meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)">
<title>Daily Task Manager</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ══════════════════════════════════════════════════════════════════
   1 · FICHAS — un solo acento, el ámbar, que significa tiempo.
       Rojo, verde y azul no son decoración: son detenido, hecho y
       calendario externo. Si algo no es ninguna de esas cosas, es
       neutro.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --fondo:#0B0F14;
  --sup:#141A21;
  --sup2:#161D26;
  --hueco:#13191F;
  --tinta:#E8ECF1;
  --tinta2:#A3ADBA;
  --tinta3:#6E7A88;
  --tinta4:#4F5A66;
  --borde:rgba(232,236,241,.13);
  --borde2:rgba(232,236,241,.07);
  --vidrio:rgba(11,15,20,.72);
  --vidrio2:rgba(11,15,20,.78);
  --velo:rgba(6,9,12,.6);
  --aro:#3A4552;

  --ambar:#FF9F0A;
  --rojo:#FF453A;
  --verde:#30D158;
  --azul:#64D2FF;

  --ambarT:rgba(255,159,10,.14);
  --rojoT:rgba(255,69,58,.14);
  --verdeT:rgba(48,209,88,.14);
  --azulT:rgba(100,210,255,.09);

  --display:Archivo, system-ui, -apple-system, sans-serif;
  --cuerpo:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --cifra:'IBM Plex Mono', ui-monospace, monospace;

  /* Un solo número gobierna toda la escala. Ajustes lo mueve y el
     diseño entero crece con él, porque nada está en px fijos. */
  --base:16px;

  --r-ch:10px;   /* fichitas */
  --r-fi:14px;   /* filas */
  --r-ta:16px;   /* tarjetas */
  --r-ho:26px;   /* hojas */

  color-scheme:dark light;
  --alto:max(env(safe-area-inset-top), 12px);
  --bajo:max(env(safe-area-inset-bottom), 14px);
}
@media (prefers-color-scheme: light){
  :root:not([data-tema="oscuro"]){
    --fondo:#FBFBFD;
    --sup:#FFFFFF;
    --sup2:#FFFFFF;
    --hueco:#F2F3F6;
    --tinta:#0B0F14;
    --tinta2:#4A5561;
    --tinta3:#78838F;
    --tinta4:#A3ADBA;
    --borde:rgba(11,15,20,.12);
    --borde2:rgba(11,15,20,.07);
    --vidrio:rgba(251,251,253,.72);
    --vidrio2:rgba(251,251,253,.8);
    --velo:rgba(30,35,42,.32);
    --aro:#C2CAD3;
    --ambar:#C77700;
    --rojo:#D70015;
    --verde:#18893B;
    --azul:#0A7EA4;
    --ambarT:rgba(199,119,0,.12);
    --rojoT:rgba(215,0,21,.1);
    --verdeT:rgba(24,137,59,.1);
    --azulT:rgba(10,126,164,.09);
  }
}
:root[data-tema="oscuro"]{color-scheme:dark}
:root[data-tema="claro"]{
  color-scheme:light;
  --fondo:#FBFBFD; --sup:#FFFFFF; --sup2:#FFFFFF; --hueco:#F2F3F6;
  --tinta:#0B0F14; --tinta2:#4A5561; --tinta3:#78838F; --tinta4:#A3ADBA;
  --borde:rgba(11,15,20,.12); --borde2:rgba(11,15,20,.07);
  --vidrio:rgba(251,251,253,.72); --vidrio2:rgba(251,251,253,.8);
  --velo:rgba(30,35,42,.32); --aro:#C2CAD3;
  --ambar:#C77700; --rojo:#D70015; --verde:#18893B; --azul:#0A7EA4;
  --ambarT:rgba(199,119,0,.12); --rojoT:rgba(215,0,21,.1);
  --verdeT:rgba(24,137,59,.1); --azulT:rgba(10,126,164,.09);
}

/* ══════════════════════════════════════════════════════════════════
   2 · PLATAFORMA — lo que separa "una web en un navegador" de algo
       que se siente instalado. Cada regla de aquí arregla un defecto
       concreto del teléfono.
   ══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;      /* girar el iPhone no reescala el texto */
  overscroll-behavior:none;           /* sin rebote de recarga robando el gesto */
  font-size:var(--base);
}
body{
  margin:0;
  font-family:var(--cuerpo);
  font-size:1rem;
  line-height:1.45;
  color:var(--tinta);
  background:var(--fondo);
  min-height:100dvh;                  /* dvh, no vh: la barra de Safari se mueve */
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
a{color:var(--ambar);text-decoration:none}
svg{flex:none}

/* El toque responde al apoyar el dedo, no al soltarlo, y nunca
   selecciona el texto del botón por mantener apretado. */
button,a,[role="button"],.toc{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
/* El texto del contenido sí se puede seleccionar y copiar. */
.sel{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}

/* Un ratón tiene puntero fino; un dedo no. El hover solo existe
   donde hay un ratón, si no se queda pegado tras cada toque. */
@media (hover:hover) and (pointer:fine){
  .toc:hover{background:var(--sup2)}
  .fila:hover{background:var(--sup2)}
  a:hover{color:var(--ambar);filter:brightness(1.15)}
}
/* 16 px es el umbral bajo el cual iOS hace zoom al enfocar un campo. */
@media (pointer:coarse){
  input,textarea,select{font-size:16px}
}

@media (prefers-reduced-transparency: reduce){
  .vidrio{background:var(--fondo)!important;backdrop-filter:none!important}
}
@media (prefers-contrast: more){
  :root{--borde:rgba(128,138,150,.6);--borde2:rgba(128,138,150,.4)}
}

/* ══════════════════════════════════════════════════════════════════
   3 · TIPOGRAFÍA — el interletraje cambia con el tamaño. Un solo
       valor para todo está mal en alguna parte: el texto grande se
       ve suelto y el chico apretado.
   ══════════════════════════════════════════════════════════════════ */
.tit{
  font-family:var(--display);
  font-size:1.85rem;
  font-weight:700;
  letter-spacing:-.03em;              /* negativo al crecer */
  line-height:1.05;
}
.tit-s{
  font-family:var(--display);
  font-size:1.25rem;
  font-weight:600;
  letter-spacing:-.018em;
  line-height:1.25;
}
.rotulo{
  font-family:var(--cifra);
  font-size:.66rem;
  font-weight:600;
  letter-spacing:.11em;               /* positivo al encoger */
  text-transform:uppercase;
  color:var(--tinta3);
}
.cifra{font-family:var(--cifra);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.menor{font-size:.82rem;color:var(--tinta3)}
/* Un texto de 34x19 px es un blanco imposible para un pulgar. El área
   de toque crece a 44 px sin que crezca lo que se ve, con relleno y un
   margen negativo que lo compensa. */
.toque{padding:.75rem;margin:-.75rem;min-height:2.75rem;display:inline-flex;align-items:center}

/* ══════════════════════════════════════════════════════════════════
   4 · MATERIALES — la barra no es una franja opaca que se come el
       alto: es una capa translúcida y el contenido pasa por debajo.
   ══════════════════════════════════════════════════════════════════ */
.vidrio{
  background:var(--vidrio);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
}

/* ══════════════════════════════════════════════════════════════════
   5 · ARMAZÓN
   ══════════════════════════════════════════════════════════════════ */
#app{min-height:100dvh;display:flex;flex-direction:column}

.cabeza{
  position:fixed;top:0;left:0;right:0;z-index:30;
  padding:calc(var(--alto) + 8px) 1.25rem .8rem;
  border-bottom:1px solid var(--borde2);
}
.cabeza-fila{display:flex;align-items:flex-end;gap:.75rem;max-width:56rem}
.cabeza-fila>div:first-child{flex:1;min-width:0}
.reloj{font-family:var(--cifra);font-size:1.6rem;font-weight:600;letter-spacing:-.03em;padding-bottom:.2rem;font-variant-numeric:tabular-nums}

main{
  flex:1;
  /* --tope lo mide el guion contra la cabecera real: si lo dejo en un
     número fijo, cambiar el tamaño de letra abre un hueco muerto.
     Abajo hay que despejar la barra y además el botón flotante. */
  padding:calc(var(--tope, 8.5rem) + 1rem) 0 calc(var(--bajo) + 9rem);
}
.env{padding-inline:1.25rem}

/* La barra de abajo: cuatro destinos con nombre propio, no un "Inicio"
   que no dice nada. */
.barra{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;
  padding:.6rem .5rem var(--bajo);
  border-top:1px solid var(--borde2);
}
.dest{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:.25rem;
  padding:.25rem 0;position:relative;color:var(--tinta3);
}
.dest[aria-current="page"]{color:var(--ambar)}
.dest span{font-size:.62rem;font-weight:700;letter-spacing:.04em}
.dest .glob{
  position:absolute;top:-2px;right:calc(50% - 1.6rem);
  min-width:1.05rem;height:1.05rem;border-radius:.6rem;
  background:var(--rojo);color:var(--fondo);
  font-family:var(--cifra);font-size:.6rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 .25rem;
}

/* El botón de capturar flota sobre la barra, no dentro de ella. */
.capturar{
  position:fixed;right:1.1rem;bottom:calc(var(--bajo) + 4.2rem);z-index:40;
  width:3.5rem;height:3.5rem;border-radius:50%;
  background:var(--ambar);color:var(--fondo);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px -6px rgba(255,159,10,.5);
}

/* ══════════════════════════════════════════════════════════════════
   6 · PIEZAS — caso, tarea y evento comparten forma. El borde de
       color dice qué es sin necesidad de leer.
   ══════════════════════════════════════════════════════════════════ */
.tarjeta{background:var(--sup);border-radius:var(--r-ta);border:1px solid transparent}
.fila{
  display:flex;gap:.7rem;align-items:flex-start;
  padding:.8rem .85rem;border-radius:var(--r-fi);background:var(--sup);
}
.tx{flex:1;min-width:0;font-size:.92rem;line-height:1.35;text-align:left}
/* El círculo se ve de 20 px pero se toca en 44: el botón es grande y
   el círculo es su ::before. */
.chk{
  width:2.75rem;height:2.75rem;margin:-.72rem -.55rem -.72rem -.72rem;
  display:grid;place-items:center;flex:none;
}
.chk::before{
  content:"";width:1.3rem;height:1.3rem;border-radius:50%;
  border:1.8px solid var(--aro);
  transition:background .15s, border-color .15s, transform .25s cubic-bezier(.3,1.6,.5,1);
}
.chk:active::before{transform:scale(.88)}
.chk[aria-pressed="true"]::before{background:var(--verde);border-color:var(--verde);transform:scale(1.1)}
.ficha{
  font-size:.66rem;font-weight:600;padding:.18rem .5rem;border-radius:1rem;
  background:var(--ambarT);color:var(--ambar);flex:none;
  display:inline-flex;align-items:center;gap:.25rem;line-height:1.35;
}
.ficha.roja{background:var(--rojoT);color:var(--rojo)}
.ficha.azul{background:var(--azulT);color:var(--azul)}
.ficha.gris{background:var(--borde2);color:var(--tinta2)}

/* ── el espinazo de Hoy: una columna de tiempo ── */
.tramo{display:flex;gap:.75rem;align-items:flex-start;margin-bottom:.15rem}
.tramo>.hora{
  flex:none;width:2.7rem;text-align:right;padding-top:.8rem;
  font-family:var(--cifra);font-size:.7rem;font-weight:500;color:var(--tinta3);
  font-variant-numeric:tabular-nums;
}
.tramo>.cuerpo{flex:1;min-width:0;padding:.7rem .85rem;border-radius:var(--r-fi)}
.ev{background:var(--azulT);border-left:3px solid var(--azul)}
.ev .cuando{font-family:var(--cifra);font-size:.7rem;color:var(--azul);margin-top:.25rem}
.bloque{background:var(--sup2);border:1px solid rgba(255,159,10,.34)}
.libre{background:var(--hueco);border:1px dashed var(--borde);color:var(--tinta3)}

/* la línea de ahora: el único ámbar que se mueve solo */
.ahora{display:flex;gap:.75rem;align-items:center;margin:.55rem 0}
.ahora .hora{flex:none;width:2.7rem;text-align:right;font-family:var(--cifra);font-size:.7rem;font-weight:700;color:var(--ambar)}
.ahora .veta{
  flex:1;height:2px;border-radius:2px;position:relative;
  background:linear-gradient(90deg,var(--ambar),rgba(255,159,10,.15));
}
.ahora .veta::before{
  content:"";position:absolute;left:-4px;top:-3px;
  width:8px;height:8px;border-radius:50%;background:var(--ambar);
}

/* ── banda de presión ── */
.presion{display:flex;gap:.55rem}
.presion>*{flex:1;min-width:0;padding:.75rem .8rem;border-radius:var(--r-ta)}
.pres-r{background:rgba(255,69,58,.11);border:1px solid rgba(255,69,58,.3)}
.pres-a{background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.28)}

.vacio{padding:2.5rem 1rem;text-align:center;color:var(--tinta3);font-size:.9rem;line-height:1.5}

/* ── botones ── */
.btn-pri,.btn-sec{
  min-height:2.5rem;padding:0 1rem;border-radius:1.25rem;
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;
  font-size:.86rem;font-weight:700;flex:none;
  transition:transform .12s ease-out, opacity .15s;
}
.btn-pri{background:var(--ambar);color:var(--fondo)}
.btn-sec{background:var(--borde2);color:var(--tinta);font-weight:600}
.btn-pri:disabled,.btn-sec:disabled{opacity:.35;cursor:default}
/* Responder al apoyar el dedo: el botón cede un 3 % en el acto. */
.btn-pri:not(:disabled):active,.btn-sec:active,.acc6 button:active,.op:active,.mini:active{transform:scale(.97)}
.mini{min-height:2rem;padding:0 .7rem;border-radius:1rem;font-size:.74rem;font-weight:600;background:var(--borde2);color:var(--tinta2)}

/* control segmentado: el elegido se levanta, no se pinta */
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:.8rem;background:var(--hueco);flex:none}
.seg button{min-height:2.25rem;padding:0 .8rem;border-radius:.62rem;font-size:.82rem;font-weight:600;color:var(--tinta3)}
.seg button[aria-pressed="true"]{background:var(--sup2);color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.22),0 0 0 1px var(--borde2)}
/* opción suelta en forma de píldora */
.op{min-height:2.25rem;padding:0 .8rem;border-radius:1.2rem;border:1px solid var(--borde);font-size:.8rem;font-weight:600;color:var(--tinta2);transition:transform .12s ease-out}
.op[aria-pressed="true"]{background:var(--ambarT);border-color:transparent;color:var(--ambar)}

/* ══════════════════════════════════════════════════════════════════
   TODO — casos y tareas en una sola lista. El caso lleva sus tareas
   colgando de un hilo, para que se vea de un vistazo qué es de qué.
   ══════════════════════════════════════════════════════════════════ */
.grupo{margin-top:1.75rem}
.env>.grupo:first-child{margin-top:0}
.grupo-cab{display:flex;align-items:baseline;gap:.5rem;margin:0 .2rem .6rem}
.grupo-cab .n{font-family:var(--cifra);font-size:.66rem;font-weight:600;color:var(--tinta4)}
.pila{display:flex;flex-direction:column;gap:.45rem}

/* Una fila deslizable son dos capas: el fondo con la acción, quieto,
   y la cara que se corre con el dedo. touch-action: pan-y deja el
   desplazamiento vertical al navegador y el horizontal a nosotros. */
.desl{position:relative;border-radius:var(--r-fi);touch-action:pan-y}
.desl>.fondo{position:absolute;inset:0;border-radius:inherit;overflow:hidden;opacity:0;background:var(--hueco)}
.fondo .lado{
  position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:.4rem;
  padding:0 1.15rem;font-size:.8rem;font-weight:700;opacity:0;
}
.fondo .der{left:0}
.fondo .izq{right:0}
.desl>.cara{position:relative}
.cara .tx{transition:transform .12s ease-out}
.cara .tx:active{transform:scale(.985)}

.caso .marca{width:3px;align-self:stretch;border-radius:2px;background:var(--borde);flex:none;margin:.1rem 0}
.caso .marca.rojo{background:var(--rojo)}
.caso .marca.ambar{background:var(--ambar)}
.caso .id{font-family:var(--cifra);font-size:.78rem;font-weight:600;color:var(--tinta3);letter-spacing:-.01em}
.caso .desc{font-size:.95rem;font-weight:600;line-height:1.3;margin-top:.12rem}
.meta{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.45rem}
.meta:empty{display:none}

.colgadas{
  margin:-.05rem 0 .3rem 1.1rem;padding-left:.7rem;
  border-left:1.5px solid var(--borde);
  display:flex;flex-direction:column;gap:.35rem;
}
.colgadas .fila{background:var(--hueco);padding:.6rem .75rem}

/* Las acciones del caso a la vista solo donde hay ratón; en el
   teléfono están en el gesto. */
.acc-h{display:none}
@media (hover:hover) and (pointer:fine){
  /* Flotan sobre la fila en vez de ocupar ancho: invisibles no deben
     robarle espacio a la descripción. */
  .acc-h{
    display:flex;gap:.3rem;position:absolute;right:.6rem;top:50%;transform:translateY(-50%);
    padding:.25rem;border-radius:1.2rem;background:var(--sup2);
    box-shadow:0 0 0 1px var(--borde2),-12px 0 16px var(--sup2);
    opacity:0;pointer-events:none;transition:opacity .15s;
  }
  .desl:hover .acc-h,.acc-h:focus-within{opacity:1;pointer-events:auto}
  .desl:hover .acc-h,.acc-h:focus-within{opacity:1}
}

@keyframes resalta{0%,35%{box-shadow:0 0 0 2px var(--ambar)}100%{box-shadow:0 0 0 2px transparent}}
.resalta>.cara{animation:resalta 1.8s ease-out}

/* la tarjeta de lo anotado dos veces */
.dobles{background:var(--sup);border:1px solid var(--borde2);border-radius:var(--r-ta);padding:.85rem .95rem .3rem}
.doble{padding:.8rem 0;border-top:1px solid var(--borde2)}
.doble:first-of-type{border-top:none;padding-top:.55rem}
.doble .cita{font-size:.9rem;font-weight:600;line-height:1.35}
.doble .por{font-size:.8rem;color:var(--tinta3);margin-top:.25rem;line-height:1.4}
.doble .por b{color:var(--tinta2);font-weight:600}
.acc{display:flex;gap:.45rem;margin-top:.65rem;flex-wrap:wrap}

/* ══════════════════════════════════════════════════════════════════
   HOJA DE CAPTURA
   ══════════════════════════════════════════════════════════════════ */
.asa{position:relative;touch-action:none}
.asa::after{content:"";position:absolute;inset:-14px -48px}
.hoja-cab{display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem;min-height:2.75rem;touch-action:none}
.hoja-cab.paso{display:grid;grid-template-columns:1fr auto 1fr}
.hoja-cab.paso .btn-pri{justify-self:end}
.atras{display:inline-flex;align-items:center;gap:.15rem;min-height:2.75rem;color:var(--ambar);font-weight:600;font-size:.9rem;justify-self:start}

.cap-tx{
  display:block;width:100%;border:none;background:none;resize:none;outline:none;
  font-family:var(--display);font-size:1.3rem;font-weight:600;letter-spacing:-.015em;line-height:1.3;
  padding:.25rem 0;min-height:2.4rem;max-height:40dvh;
}
.cap-tx::placeholder{color:var(--tinta4)}
.lectura{margin-top:.3rem}
.detec{
  margin-top:.8rem;padding:.8rem .9rem;border-radius:var(--r-fi);
  background:var(--hueco);border:1px solid var(--borde2);
  font-size:.84rem;line-height:1.4;color:var(--tinta2);
}
.detec b{color:var(--tinta);font-weight:600}

.plegar{display:flex;align-items:center;gap:.35rem;margin-top:.7rem;min-height:2.75rem;width:100%;color:var(--tinta3);font-size:.84rem;font-weight:600}
.plegar .res{flex:1;text-align:right;font-weight:500;color:var(--tinta4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detalles{margin-top:.9rem;display:flex;flex-direction:column;gap:.95rem}
.campo{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.fila-op{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.campo input,.campo select,.cap-notas{
  min-height:2.5rem;padding:0 .7rem;border-radius:.7rem;
  border:1px solid var(--borde);background:var(--hueco);font-size:.92rem;min-width:0;
}
.campo select{width:100%}
.campo input[type="text"]{width:100%}
.cap-notas{padding:.6rem .7rem;resize:vertical;line-height:1.4;width:100%}
.campo input:focus-visible,.campo select:focus-visible,.cap-notas:focus-visible{outline:2px solid var(--ambar);outline-offset:1px}

/* las seis acciones de Evernote: cámara, escanear, archivo, boceto,
   grabadora y evento */
.acc6{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem;margin-top:1.1rem}
.acc6 button{
  display:flex;flex-direction:column;align-items:center;gap:.35rem;
  padding:.7rem 0 .6rem;border-radius:var(--r-fi);background:var(--hueco);
  color:var(--tinta2);font-size:.62rem;font-weight:600;letter-spacing:.01em;
  transition:transform .12s ease-out;min-width:0;
}
.acc6 button[aria-disabled="true"]{opacity:.45}
@media (max-width:359px){.acc6{grid-template-columns:repeat(3,1fr)}}
.pie-edit{display:flex;gap:.5rem;margin-top:1.2rem;align-items:center}
.sin-nube{margin-top:.8rem;line-height:1.45}

/* ── entrada ── */
.entrada{position:fixed;inset:0;z-index:90;background:var(--fondo);display:grid;place-items:center;padding:1.5rem 1.25rem calc(var(--bajo) + 1rem)}
.entrada[hidden]{display:none}
.entrada-caja{width:min(22rem,100%);text-align:center}
.entrada input{display:block;width:100%;min-height:2.9rem;padding:0 .9rem;border-radius:.8rem;border:1px solid var(--borde);background:var(--hueco);margin-top:.5rem}
.entrada input:focus-visible{outline:2px solid var(--ambar);outline-offset:1px}
.ancho{width:100%;flex:1;min-height:2.9rem}

/* boceto: el papel es blanco en los dos temas, como una hoja real */
.lienzo-bo{display:block;width:100%;height:min(50dvh,26rem);border-radius:var(--r-fi);background:#fff;touch-action:none;border:1px solid var(--borde);cursor:crosshair}
.bo-herr{display:flex;align-items:center;gap:.6rem;margin-top:.75rem;flex-wrap:wrap}
.colores{display:flex;gap:.4rem}
.color{width:2rem;height:2rem;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--sup)}
.color[aria-pressed="true"]{border-color:var(--tinta)}
.seg .punto{display:block;border-radius:50%;background:currentColor}

/* grabadora: el botón de siempre, círculo que se vuelve cuadrado */
.grab{display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:1.2rem 0 .4rem}
.grab .t{font-family:var(--cifra);font-size:2.6rem;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.grab-btn{width:4.5rem;height:4.5rem;border-radius:50%;border:3px solid var(--tinta3);display:grid;place-items:center}
.grab-btn::before{content:"";width:3.5rem;height:3.5rem;border-radius:50%;background:var(--rojo);transition:width .3s cubic-bezier(.3,1.3,.5,1),height .3s cubic-bezier(.3,1.3,.5,1),border-radius .3s}
.grab-btn.on::before{width:1.6rem;height:1.6rem;border-radius:.4rem}

/* ══════════════════════════════════════════════════════════════════
   7 · CAPAS — el velo atenúa y empuja atrás lo de abajo; la hoja
       llega como un material, no como una opacidad que sube.
   ══════════════════════════════════════════════════════════════════ */
#velo{
  position:fixed;inset:0;z-index:50;background:var(--velo);
  opacity:0;pointer-events:none;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
#velo.on{pointer-events:auto}
.hoja{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;
  border-radius:var(--r-ho) var(--r-ho) 0 0;
  background:var(--sup);
  border-top:1px solid var(--borde);
  box-shadow:0 -24px 70px -20px rgba(0,0,0,.8);
  padding:.6rem 1.15rem calc(var(--bajo) + 1.2rem);
  transform:translateY(100%);
  visibility:hidden;
  overscroll-behavior:contain;
}
.hoja.on{visibility:visible}
.asa{
  width:2.4rem;height:4px;border-radius:3px;
  background:var(--borde);margin:0 auto 1.1rem;
}

/* ── avisos ── */
#avisos{
  position:fixed;left:50%;bottom:calc(var(--bajo) + 5rem);z-index:70;
  transform:translateX(-50%);
  display:flex;flex-direction:column;gap:.45rem;align-items:center;
  width:min(26rem,calc(100% - 2rem));pointer-events:none;
}
.aviso{
  pointer-events:auto;width:100%;
  display:flex;align-items:center;gap:.6rem;
  padding:.7rem .85rem;border-radius:var(--r-fi);
  background:var(--sup);border:1px solid var(--borde);
  box-shadow:0 12px 34px -12px rgba(0,0,0,.7);
  font-size:.86rem;
}
.aviso .txt{flex:1;min-width:0}
.aviso button{color:var(--ambar);font-weight:700;font-size:.82rem;flex:none}

/* ══════════════════════════════════════════════════════════════════
   8 · MOVIMIENTO REDUCIDO — no significa sin respuesta: significa
       una equivalencia suave que no mueve el mundo.
   ══════════════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce){
  .hoja{transition:opacity .2s ease}
  *{scroll-behavior:auto!important}
}

/* ══════════════════════════════════════════════════════════════════
   9 · ESCRITORIO — el Mac no es un teléfono estirado. Barra al
       costado y dos columnas.
   ══════════════════════════════════════════════════════════════════ */
@media (min-width: 900px){
  .barra{
    top:0;bottom:0;right:auto;width:5.5rem;
    flex-direction:column;justify-content:flex-start;gap:.35rem;
    border-top:none;border-right:1px solid var(--borde2);
    padding:calc(var(--alto) + 1rem) .5rem 1rem;
  }
  /* Sin esto, flex:1 estira cada destino hasta repartirse el alto
     entero de la pantalla y quedan a un palmo unos de otros. */
  .dest{flex:none;padding:.7rem 0;border-radius:var(--r-ch)}
  .dest .glob{top:.15rem;right:calc(50% - 1.4rem)}
  .cabeza{left:5.5rem;padding-inline:2rem}
  main{margin-left:5.5rem;padding-bottom:3rem}
  .env{padding-inline:2rem;max-width:56rem}
  .capturar{left:1.1rem;right:auto;bottom:1.5rem}
  /* En el Mac la hoja ocupa el centro: los avisos se van a la esquina
     para no taparla. */
  #avisos{left:auto;right:1.5rem;bottom:1.5rem;transform:none;width:min(24rem,40vw)}
  .hoja{
    left:50%;right:auto;bottom:auto;top:50%;
    width:min(34rem,90vw);
    border-radius:var(--r-ho);
    max-height:82dvh;
  }
}
</style>
</head>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════════
   MOTOR DE RESORTES

   Una animación de duración fija no puede responder a una entrada
   nueva: hay que esperar a que termine. Un resorte sí — la entrada
   nueva solo cambia la meta, y el movimiento nunca se corta.

   Dos parámetros, los de Apple, no masa/rigidez:
     respuesta      cuán rápido llega a la meta, en segundos
     amortiguación  1 = sin rebote; menos = rebota

   Regla: 1.0 para todo lo normal. 0.8 solo cuando el gesto traía
   impulso, porque un menú que apareció solo no debe rebotar.
   ══════════════════════════════════════════════════════════════════ */
/* tol: cuándo se da por quieto, en las unidades del valor. Por defecto
   sirve para valores de 0 a 1; un resorte en píxeles pasa algo como
   0.25, o esperaría a moverse una milésima de píxel. */
function Resorte(inicial, alCambiar, tol){
  tol = tol || .0005;
  let x = inicial, v = 0, meta = inicial;
  let resp = .4, amor = 1, vivo = false, id = 0;
  let alLlegar = null;

  function integrar(dt){
    /* Sub-pasos fijos: con un cuadro largo (pestaña de fondo, equipo
       cargado) un solo paso grande hace explotar el resorte. */
    const paso = 1/240;
    let t = Math.min(dt, .064);
    const w = 2*Math.PI/resp;
    while(t > 0){
      const h = Math.min(paso, t);
      const a = -w*w*(x - meta) - 2*amor*w*v;
      v += a*h;
      x += v*h;
      t -= h;
    }
  }
  function cuadro(ant){
    return function(ahora){
      if(!vivo) return;
      integrar((ahora - ant)/1000);
      ant = ahora;
      const quieto = Math.abs(x - meta) < tol && Math.abs(v) < tol*3;
      if(quieto){ x = meta; v = 0; vivo = false; alCambiar(x, v); if(alLlegar){ const f = alLlegar; alLlegar = null; f(); } return; }
      alCambiar(x, v);
      id = requestAnimationFrame(cuadro(ant));
    };
  }
  function arrancar(){
    if(vivo) return;
    vivo = true;
    id = requestAnimationFrame(cuadro(performance.now()));
  }
  return {
    /* Reapuntar: el resorte sigue desde donde está y con la velocidad
       que lleva. Eso es lo que permite agarrar algo en vuelo. */
    a(nueva, op){
      op = op || {};
      meta = nueva;
      if(op.respuesta != null) resp = op.respuesta;
      if(op.amortiguacion != null) amor = op.amortiguacion;
      if(op.velocidad != null) v = op.velocidad;
      alLlegar = op.alLlegar || null;
      if(REDUCIDO){ x = meta; v = 0; vivo = false; alCambiar(x, 0); if(op.alLlegar) op.alLlegar(); return; }
      arrancar();
    },
    /* Durante un arrastre mandamos nosotros: el resorte se apaga y el
       valor sigue al dedo uno a uno. */
    fijar(nuevo, velocidad){
      vivo = false; cancelAnimationFrame(id);
      x = nuevo; if(velocidad != null) v = velocidad;
      alCambiar(x, v);
    },
    get valor(){ return x; },
    get velocidad(){ return v; },
    get meta(){ return meta; },
    detener(){ vivo = false; cancelAnimationFrame(id); }
  };
}

const REDUCIDO = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Dónde va a parar un lanzamiento. No es la fórmula de física del
   colegio: es la caída exponencial que usa el desplazamiento de iOS.
   Sin esto, un tirón fuerte y uno suave terminan en el mismo sitio. */
function proyectar(velocidad, freno){
  freno = freno == null ? .998 : freno;
  return (velocidad/1000) * freno / (1 - freno);
}

/* En el borde no se frena en seco: se resiste cada vez más. Un tope
   duro se lee como "se colgó"; la resistencia se lee como "responde,
   pero aquí se acabó". */
function gomaElastica(exceso, largo, k){
  k = k == null ? .55 : k;
  return (exceso * largo * k) / (largo + k * Math.abs(exceso));
}

/* ══════════════════════════════════════════════════════════════════
   GESTO DE ARRASTRE

   Historial corto de posiciones para sacar la velocidad al soltar. La
   velocidad instantánea del último evento es ruido; el promedio de
   los últimos ~80 ms es lo que el dedo hizo de verdad.
   ══════════════════════════════════════════════════════════════════ */
function arrastrable(el, op){
  let historial = [], activo = false, origen = 0, agarre = 0, decidido = false;

  function velocidad(){
    const ahora = performance.now();
    const h = historial.filter(p => ahora - p.t < 80);
    if(h.length < 2) return 0;
    const a = h[0], b = h[h.length-1];
    const dt = (b.t - a.t)/1000;
    return dt > 0 ? (b.y - a.y)/dt : 0;
  }

  el.addEventListener('pointerdown', e => {
    if(op.puedeEmpezar && !op.puedeEmpezar(e)) return;
    activo = true; decidido = false;
    origen = e.clientY;
    agarre = op.valor();
    historial = [{y:e.clientY, t:performance.now()}];
    el.setPointerCapture(e.pointerId);
    if(op.alTomar) op.alTomar();
  });

  el.addEventListener('pointermove', e => {
    if(!activo) return;
    historial.push({y:e.clientY, t:performance.now()});
    if(historial.length > 12) historial.shift();
    const d = e.clientY - origen;
    /* Histéresis: hasta 10 px no se compromete a una dirección, para
       que un toque con temblor no se lea como arrastre. */
    if(!decidido){
      if(Math.abs(d) < 10) return;
      decidido = true;
    }
    e.preventDefault();
    op.alMover(agarre + d, velocidad());
  });

  function soltar(e){
    if(!activo) return;
    activo = false;
    try{ el.releasePointerCapture(e.pointerId); }catch(err){}
    op.alSoltar(decidido ? velocidad() : 0, decidido);
  }
  el.addEventListener('pointerup', soltar);
  el.addEventListener('pointercancel', soltar);
}

/* ══════════════════════════════════════════════════════════════════
   UTILIDADES
   ══════════════════════════════════════════════════════════════════ */
const $  = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dosCifras = n => String(n).padStart(2,'0');

const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function hoyISO(d){
  d = d || new Date();
  return d.getFullYear() + '-' + dosCifras(d.getMonth()+1) + '-' + dosCifras(d.getDate());
}
function hhmm(d){ d = d || new Date(); return dosCifras(d.getHours()) + ':' + dosCifras(d.getMinutes()); }
function minutosDe(h){ const m = /^(\d{1,2}):(\d{2})/.exec(h||''); return m ? (+m[1])*60 + (+m[2]) : null; }

function diasDesde(iso){
  if(!iso) return null;
  const a = new Date(iso + 'T00:00:00');
  if(isNaN(a)) return null;
  return Math.floor((new Date(hoyISO()+'T00:00:00') - a) / 86400000);
}
/* "3 días", no "3 día" ni "3 días quieto hace" */
function enDias(n){ return n === 0 ? 'hoy' : n === 1 ? '1 día' : n + ' días'; }

function saludo(h){
  h = h == null ? new Date().getHours() : h;
  return h < 6 ? 'Buenas noches' : h < 13 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches';
}

/* ══════════════════════════════════════════════════════════════════
   DATOS

   Misma forma que v4, pero v5 tiene su propio proyecto de Firebase
   (taskmanager-ebec9) y su propia copia en este equipo: parte en
   blanco y los datos viejos se traspasan a mano.

     tarea  {tid, done, text, cat, notas, adj[], venc, rep, rec, ck[], creado}
     caso   {id, desc, estado, act, rec, adj[], notas, hist[]}

   Nuevo en v5, y solo esto:
     tarea.caso   número de caso al que pertenece la tarea
     tarea.ini    hora de inicio, para poder ponerla en la columna
     tarea.dur    minutos que se estima que toma
   ══════════════════════════════════════════════════════════════════ */
const CLAVE_LOCAL = 'dtm5-data';        /* propia: no arrastra lo de v4 */
const CID = Math.random().toString(36).slice(2);

let S = {tareas:[], tareasCerradas:[], casos:[], cerrados:[], agenda:[], enlaces:[], focos:[]};
let ref = null, guardando = 0;

function normalizar(){
  S.tareas = (S.tareas||[]).map(t => Object.assign({
    tid:'t'+Math.random().toString(36).slice(2),
    done:false, text:'', cat:'', notas:'', adj:[], venc:'', rep:'', rec:'',
    ck:[], creado:hoyISO(), caso:'', ini:'', dur:0
  }, t));
  S.tareas.forEach(t => { if(!CATS[t.cat]) t.cat = 'planificar'; });
  /* Los estados son los de v4, tal cual: EN PROGRESO y EN ESPERA. Un
     caso cerrado no tiene estado, se muda a S.cerrados. */
  S.casos = (S.casos||[]).map(c => Object.assign({
    id:'', desc:'', estado:'EN PROGRESO', act:hoyISO(), rec:'', adj:[], notas:'', hist:[]
  }, c));
  S.casos.forEach(c => {
    if(c.estado === 'ESPERANDO') c.estado = 'EN ESPERA';
    if(c.estado !== 'EN ESPERA') c.estado = 'EN PROGRESO';
    if(!Array.isArray(c.hist)) c.hist = [];
    if(!Array.isArray(c.adj)) c.adj = [];
  });
  S.focos = S.focos || [];
  S.agenda  = S.agenda  || [];
  S.enlaces = S.enlaces || [];
  S.cerrados = S.cerrados || [];
  S.tareasCerradas = S.tareasCerradas || [];
}

function cargarLocal(){
  try{
    const d = JSON.parse(localStorage.getItem(CLAVE_LOCAL) || 'null');
    if(d) S = Object.assign(S, d);
  }catch(e){}
  normalizar();
}

function guardar(){
  try{ localStorage.setItem(CLAVE_LOCAL, JSON.stringify(S)); }catch(e){}
  if(!ref) return;
  clearTimeout(guardando);
  guardando = setTimeout(() => {
    ref.set({
      tareas:S.tareas, tareasCerradas:S.tareasCerradas, casos:S.casos, cerrados:S.cerrados,
      agenda:S.agenda, enlaces:S.enlaces, focos:S.focos,
      by:CID, upd:new Date().toISOString()
    }).catch(e => aviso('No se pudo guardar en la nube: ' + e.message));
  }, 420);
}
function aplicar(){ pintar(); guardar(); }

/* ══════════════════════════════════════════════════════════════════
   LECTURA DEL DÍA

   Un caso "se enfría" cuando lleva días sin que nadie lo toque. Eso
   es lo único que la pantalla grita, porque es lo único que se pierde
   solo si nadie mira.
   ══════════════════════════════════════════════════════════════════ */
const UMBRAL_FRIO = 2;

function casosAbiertos(){ return S.casos; }

/* Un caso en espera no se enfría: está esperando a otro, a propósito. */
function enfriandose(){
  return casosAbiertos().filter(c => c.estado !== 'EN ESPERA')
    .map(c => Object.assign({}, c, {quieto: diasDesde(c.act)}))
    .filter(c => c.quieto != null && c.quieto >= UMBRAL_FRIO)
    .sort((a,b) => b.quieto - a.quieto);
}

function tareasDeHoy(){
  const h = hoyISO();
  return S.tareas.filter(t => !t.done && (!t.venc || t.venc <= h));
}
function eventosDeHoy(){
  const h = hoyISO();
  return (S.agenda||[]).filter(e => e.d === h).sort((a,b) => (a.hora||'').localeCompare(b.hora||''));
}

/* Lo que va en la columna de tiempo: eventos con hora, más tareas que
   tienen hora puesta. Lo que no tiene hora no va aquí — va en Todo,
   que es donde se elige, no donde se ejecuta. */
function columnaDelDia(){
  const filas = [];
  for(const e of eventosDeHoy()){
    const m = minutosDe(e.hora);
    if(m == null) continue;
    filas.push({tipo:'evento', min:m, dato:e});
  }
  for(const t of tareasDeHoy()){
    const m = minutosDe(t.ini);
    if(m == null) continue;
    filas.push({tipo:'bloque', min:m, dato:t});
  }
  filas.sort((a,b) => a.min - b.min);

  /* Huecos: solo los que valen la pena mencionar. Un hueco de 20
     minutos no es una oportunidad, es ruido. */
  const conHuecos = [];
  for(let i = 0; i < filas.length; i++){
    conHuecos.push(filas[i]);
    const sig = filas[i+1];
    if(!sig) continue;
    const finEste = filas[i].min + duracionDe(filas[i]);
    const largo = sig.min - finEste;
    if(largo >= 60) conHuecos.push({tipo:'libre', min:finEste, largo:largo});
  }
  return conHuecos;
}
function duracionDe(f){
  if(f.tipo === 'evento'){
    const a = minutosDe(f.dato.hora), b = minutosDe(f.dato.fin);
    return (a != null && b != null && b > a) ? b - a : 30;
  }
  return f.dato.dur || 45;
}
function comoHora(min){ return dosCifras(Math.floor(min/60)) + ':' + dosCifras(min % 60); }

/* "4,8 h" no es un hueco que alguien se imagine. A media hora, sí.
   Y en español la coma decimal, no el punto. */
function enHoras(min){
  if(min < 60) return min + ' min';
  const medias = Math.round(min/30)/2;
  const txt = Number.isInteger(medias) ? String(medias) : String(medias).replace('.', ',');
  return txt + ' h';
}

/* ══════════════════════════════════════════════════════════════════
   AVISOS — confirmación con deshacer. Un error se arregla soltando,
   no confirmando antes de cada acción.
   ══════════════════════════════════════════════════════════════════ */
function aviso(texto, deshacer){
  const n = document.createElement('div');
  n.className = 'aviso';
  n.innerHTML = '<span class="txt"></span>';
  n.querySelector('.txt').textContent = texto;
  if(deshacer){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'Deshacer';
    b.addEventListener('click', () => { deshacer(); cerrar(); });
    n.appendChild(b);
  }
  $('avisos').appendChild(n);

  const op = Resorte(0, v => {
    n.style.opacity = v;
    n.style.transform = 'translateY(' + ((1-v) * 12) + 'px)';
  });
  op.a(1, {respuesta:.35});

  let fuera = setTimeout(cerrar, deshacer ? 6000 : 3200);
  function cerrar(){
    clearTimeout(fuera);
    op.a(0, {respuesta:.3, alLlegar: () => n.remove()});
  }
  return cerrar;
}

/* ══════════════════════════════════════════════════════════════════
   LA HOJA

   Se arrastra. Sigue al dedo uno a uno, resiste al pasarse del tope,
   y al soltar no mira dónde quedó sino hacia dónde iba: por eso un
   tirón corto pero rápido la cierra, y uno largo pero lento no.
   ══════════════════════════════════════════════════════════════════ */
function Hoja(id, op){
  op = op || {};
  const el = $(id);
  const velo = $('velo');
  /* En el Mac la hoja es un panel centrado: no sube desde abajo, se
     asienta. Mismo resorte, otra geometría. */
  const escritorio = matchMedia('(min-width: 900px)');
  let alto = 0, abierta = false;

  const opac = Resorte(0, v => { velo.style.opacity = Math.max(0, v); });
  const pos = Resorte(1, v => {
    if(escritorio.matches){
      el.style.transform = 'translate(-50%,-50%) translateY(' + (v * 28) + 'px) scale(' + (1 - v * .05) + ')';
      el.style.opacity = Math.max(0, Math.min(1, 1 - v * 1.4));
    }else{
      el.style.transform = 'translateY(' + (v * 100) + '%)';
      el.style.opacity = '';
    }
  });

  /* Si el contenido cabe entero, toda la hoja es asa. Si no cabe, el
     dedo dentro del contenido es para desplazarlo y solo el asa y la
     cabecera arrastran. */
  function medirGesto(){
    el.style.touchAction = el.scrollHeight > el.clientHeight + 1 ? '' : 'none';
  }

  /* instantaneo: cuando se abre con el teclado. Lo que se hace cien
     veces al día no se anima. */
  function abrir(instantaneo){
    abierta = true;
    el.classList.add('on');
    alto = el.offsetHeight || 1;
    velo.hidden = false;
    velo.classList.add('on');
    document.body.style.overflow = 'hidden';
    medirGesto();
    if(instantaneo){ opac.fijar(1); pos.fijar(0); return; }
    opac.a(1, {respuesta:.3});
    /* Amortiguación 0.8 en el teléfono: la hoja es un objeto que se
       lanza hacia arriba. En el Mac aparece un panel: sin rebote. */
    pos.a(0, {respuesta:.3, amortiguacion: escritorio.matches ? 1 : .8});
  }
  function cerrar(velocidad){
    if(!abierta) return;
    abierta = false;
    /* Soltar el foco primero: en el teléfono baja el teclado junto con
       la hoja y no después. */
    if(el.contains(document.activeElement)) document.activeElement.blur();
    opac.a(0, {respuesta:.3});
    pos.a(1, {
      respuesta:.3, amortiguacion:1,
      velocidad: velocidad != null ? velocidad/alto : null,
      alLlegar(){
        el.classList.remove('on');
        velo.classList.remove('on');
        velo.hidden = true;
        document.body.style.overflow = '';
        if(op.alCerrar) op.alCerrar();
      }
    });
  }

  arrastrable(el, {
    puedeEmpezar(e){
      if(escritorio.matches) return false;
      /* Si el contenido está desplazado hacia abajo, el dedo pertenece
         al desplazamiento, no a la hoja. */
      if(el.scrollTop > 0) return false;
      return !e.target.closest('input, textarea, button, a, select, label, canvas, audio');
    },
    valor(){ return pos.valor * alto; },
    alTomar(){ alto = el.offsetHeight || 1; },
    alMover(px){
      /* Hacia arriba no se abre más de lo que hay: se resiste. */
      const y = px < 0 ? -gomaElastica(-px, alto) : px;
      pos.fijar(y/alto);
      velo.style.opacity = Math.max(0, 1 - (y/alto));
    },
    alSoltar(v, hubo){
      if(!hubo){ pos.a(0, {respuesta:.3}); opac.a(1, {respuesta:.3}); return; }
      /* La decisión la toma la proyección, no la posición al soltar. */
      const donde = pos.valor*alto + proyectar(v);
      if(donde > alto*0.35) cerrar(v);
      else { pos.a(0, {respuesta:.3, amortiguacion:.8, velocidad:v/alto}); opac.a(1, {respuesta:.3}); }
    }
  });

  velo.addEventListener('click', () => cerrar());
  addEventListener('keydown', e => { if(e.key === 'Escape' && abierta){ e.preventDefault(); cerrar(); } });

  /* El teclado del teléfono tapa lo que está pegado abajo. La hoja se
     sube justo lo que el teclado ocupa, ni más ni menos. */
  if(window.visualViewport){
    const vv = visualViewport;
    const ajustar = () => {
      if(escritorio.matches){ el.style.bottom = ''; el.style.maxHeight = ''; return; }
      const tapa = Math.max(0, innerHeight - vv.height - vv.offsetTop);
      el.style.bottom = tapa ? tapa + 'px' : '';
      el.style.maxHeight = tapa ? (vv.height - 16) + 'px' : '';
    };
    vv.addEventListener('resize', ajustar);
    vv.addEventListener('scroll', ajustar);
  }

  return {abrir, cerrar, medirGesto, get abierta(){ return abierta; }};
}
